[book]
authors = ["SantaChains"]
language = "zh"
src = "src"
title = "heartflow 文档"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
# mdBook 0.5 已移除 additional-themes;自定义配色走 additional-css(加载在最后、同特异性则后者优先),
# 在 kurosawa.css 里以 .ayu 选择器覆盖主题变量,并把默认主题定为 ayu——站点即呈现黑泽明配色。
additional-css = ["theme/kurosawa.css"]
git-repository-url = "https://github.com/SantaChains/heartflow"
edit-url-template = "https://github.com/SantaChains/heartflow/edit/main/docs/{path}"
# GitHub Pages 项目页默认子路径；若配了自定义域名，把这里改成 "/" 并填 cname。
site-url = "/heartflow/"
# cname = "docs.example.com"

[output.html.fold]
enable = true
level = 1
