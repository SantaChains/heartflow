[package]
name = "heartflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Terminal-native coding agent (binary: hf)"
publish.workspace = true

[[bin]]
name = "hf"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
api = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
commands = { workspace = true }
# crossterm 0.29 is the single backend copy: ratatui 0.30's crossterm feature
# (via ratatui-crossterm) requires 0.29, and inquire 0.9 already pulls 0.29 —
# the upgrade *converged* the terminal stack instead of adding a third copy.
# The ratatui input editor owns idle input, inquire owns during-turn prompts,
# so the two never drive the terminal at once. P4-c.3 replaces inquire with
# ratatui overlays, after which nothing else needs to change.
crossterm = "0.29"
dirs = "7.0"
inquire = "0.9"
mcp = { workspace = true }
mimalloc = "0.1"
os_info = "3"
pulldown-cmark = "0.13"
provider = { workspace = true }
proxy = { workspace = true }
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which runs the
# *same* WordWrapper the renderer uses. Measuring wrapped row heights with the
# renderer's own composer keeps the transcript's scroll math exact against what
# actually draws (no hand-rolled wrap counter to drift). In ratatui 0.30 the
# feature lives on ratatui-widgets and the umbrella no longer forwards it, so
# the widgets crate is a direct dependency purely to toggle the feature (same
# ^0.3 requirement ratatui 0.30 itself has; cargo unifies them into one copy).
ratatui = "0.30"
ratatui-widgets = { version = "0.3.2", features = ["unstable-rendered-line-info"] }
runtime = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
store = { workspace = true }
strsim = "0.11"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
toml = "1.1"
tools = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tui-textarea 0.7 on crates.io still pins ratatui ^0.29 (would fork ratatui
# into two copies inside one binary). Upstream main @0ce5d4b (2026-02-19,
# "updated ratatui to 0.30", no later commits) declares ratatui 0.30 but still
# carries its own `crossterm 0.28` conversion module — which would fork
# crossterm instead. `no-backend` drops that module entirely; the small
# crossterm 0.29 → `Input` mapping lives in `editor::tui_input`, mirroring
# upstream semantics. Flip to the crates.io release when 0.7.1 ships.
tui-textarea = { git = "https://github.com/ketexon/tui-textarea", rev = "0ce5d4b072167551bdaecd60344232d1aed4fb45", default-features = false, features = [
    "no-backend",
] }
unicode-width = "0.2"

[lints]
workspace = true
