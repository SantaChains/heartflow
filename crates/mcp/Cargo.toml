[package]
name = "heartflow-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) client for heartflow"
publish.workspace = true

[lib]
name = "mcp"

[dependencies]
serde_json = "1"
# Reused from the `api` crate's already-vendored tree (offline, no new crates):
# async HTTP for the Streamable-HTTP transport, driven from a dedicated thread.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
