[package]
name = "heartflow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Core runtime for the heartflow coding agent"
publish.workspace = true

[lib]
name = "runtime"

[dependencies]
glob = "0.3"
globset = "0.4"
ignore = "0.4.33"
memchr = "2"
chardetng = "0.1"
encoding_rs = "0.8"
regex = "1"
nucleo-matcher = "0.3"
similar = "2"
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
jsonschema = { version = "0.56.0", default-features = false }

[lints]
workspace = true
