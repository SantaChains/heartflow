[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glob = "0.3"
ignore = "0.4.33"
chardetng = "0.1"
encoding_rs = "0.8"
regex = "1"
nucleo-matcher = "0.3"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
jsonschema = { version = "0.56.0", default-features = false }

[lints]
workspace = true
