[package]
name = "heartflow-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Provider configuration and streaming API adapters for heartflow"
publish.workspace = true

[lib]
name = "provider"

[dependencies]
api = { workspace = true }
runtime = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
# Test-only: the cassette suite drives both the relay task and a real
# ConversationRuntime, which needs a runtime and a cancellation token.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", default-features = false }

[lints]
workspace = true
