[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
# 真实下限来自依赖(image/time/simd-json/globset/ignore 均要求 1.88),声明后可让旧
# 工具链得到明确报错而不是晦涩的依赖解析失败;开发用工具链见 rust-toolchain.toml
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/SantaChains/heartflow"
readme = "README.md"
publish = true

# 内部 crate 发布到 crates.io 统一挂 heartflow- 前缀(api/runtime 等裸名已被占用),
# 靠依赖重命名(package =)保住各 crate 内 use 语句不变;下方 version req 由
# release.sh publish 时随根版本同步改写(cargo publish 要求 path 依赖带 req)
[workspace.dependencies]
api = { package = "heartflow-api", version = "1.1.0", path = "crates/api" }
commands = { package = "heartflow-commands", version = "1.1.0", path = "crates/commands" }
mcp = { package = "heartflow-mcp", version = "1.1.0", path = "crates/mcp" }
provider = { package = "heartflow-provider", version = "1.1.0", path = "crates/provider" }
runtime = { package = "heartflow-runtime", version = "1.1.0", path = "crates/runtime" }
store = { package = "heartflow-store", version = "1.1.0", path = "crates/store" }
tools = { package = "heartflow-tools", version = "1.1.0", path = "crates/tools" }

# Shipped binaries were being built with rustc's defaults: no LTO, 16 codegen
# units, DWARF left in. These profiles are the single largest runtime/startup
# lever for a release `hf`, and they cost nothing in the CI gate — `cargo test`
# and `cargo check` run under the `dev`/`test` profiles, which are untouched.
[profile.release]
# Whole-graph inlining: the workspace is 8 shallow crates, so cross-crate
# devirtualization of the `ApiClient`/`Transport` trait objects pays off.
lto = "fat"
# Maximum optimization scope (slowest build, fastest code). Release builds now
# take minutes, not seconds — that is the intended trade.
codegen-units = 1
# Drop DWARF but keep the symbol table, so a release panic still gives named
# frames in a backtrace instead of a wall of addresses.
strip = "debuginfo"
# Kept deliberately: no `catch_unwind` exists anywhere in the workspace, so
# `panic = "abort"` would be behaviourally safe and a little smaller/faster —
# but it would also erase the backtrace of the first real production panic.
# Switch to `abort` + `strip = "symbols"` only if size outranks diagnosability.
panic = "unwind"

# Benchmarks inherit `release` (incl. the fat LTO above) but keep debug info so
# profilers (perf, flamegraph) can resolve frames.
[profile.bench]
debug = true
strip = "none"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
