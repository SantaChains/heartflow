[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SantaChains/heartflow"
publish = true

# 内部 crate 发布到 crates.io 统一挂 heartflow- 前缀(api/runtime 等裸名已被占用),
# 靠依赖重命名(package =)保住各 crate 内 use 语句不变;下方 version req 由
# release.sh publish 时随根版本同步改写(cargo publish 要求 path 依赖带 req)
[workspace.dependencies]
api = { package = "heartflow-api", version = "1.0.0", path = "crates/api" }
commands = { package = "heartflow-commands", version = "1.0.0", path = "crates/commands" }
mcp = { package = "heartflow-mcp", version = "1.0.0", path = "crates/mcp" }
runtime = { package = "heartflow-runtime", version = "1.0.0", path = "crates/runtime" }
store = { package = "heartflow-store", version = "1.0.0", path = "crates/store" }
tools = { package = "heartflow-tools", version = "1.0.0", path = "crates/tools" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
