# git-cliff —— heartflow 发布日志与 GitHub Release Notes 规则
# 版本语义与 .github/workflows/release.yml 对齐:feat→minor、fix→patch、!/BREAKING CHANGE→major
# chore/docs/test/ci/style/build 及 chore(release) 机器人提交不入正文
# 提交 scope 约定为 crate 名:runtime / api / tools / mcp / store / commands / cli

[changelog]
header = ""
body = """
{% if version %}\
# heartflow {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
# 未发布
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**[不兼容]** {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_uncommitted = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(docs|style|test|ci|build|chore|merge)", skip = true },
  { message = "^feat", group = "新功能" },
  { message = "^fix", group = "缺陷修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "重构" },
  { message = ".*", group = "其他" },
]
