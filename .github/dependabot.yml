version: 2
updates:
  # Rust 依赖:minor/patch 合并为单个 PR,减少噪音;major 单独出 PR 便于审查
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]

  # Actions 版本跟进:仓库策略是钉版本,由 dependabot 统一提 PR 更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
