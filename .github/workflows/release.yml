name: Release

# heartflow 自动发布,三段式:plan(dry) → publish → windows-installer(仅 major)
#   - 零 Node:版本计算/CHANGELOG/Release 全部走 scripts/release.sh + git-cliff,本地可先行验证省 Actions
#   - 语义:feat→minor、fix→patch、!/BREAKING CHANGE→major;chore 等 push 在 plan 秒级短路
#   - Windows amd64 安装包仅在 major 触发;整条构建链路(含 upload)注释占位,启用即整体解开
#   - 代码质量门由 ci.yml 独立负责,本流水线不做 fmt/clippy/test
#   - 本地预检:bash scripts/release.sh plan;RELEASE_DRY_RUN=1 bash scripts/release.sh publish

on:
  push:
    branches: [main]
  workflow_dispatch: # 仅用于发布失败后重试,concurrency 锁防与 push 重叠

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 418982825+github-actions[bot]@users.noreply.github.com

jobs:
  plan:
    name: dry 算版本(只读)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      released: ${{ steps.plan.outputs.released }}
      bump: ${{ steps.plan.outputs.bump }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-git-cliff
      - id: plan
        run: bash scripts/release.sh plan

  publish:
    name: 版本落地 / tag / GitHub Release
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-git-cliff
      - name: release.sh publish
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_BUMP: ${{ needs.plan.outputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh publish

  windows-installer:
    name: win-amd64 安装包(仅 major)
    needs: [plan, publish]
    if: needs.plan.outputs.bump == 'major'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: placeholder(启用打包时解开下方全部步骤,含 upload)
        shell: pwsh
        run: Write-Output "构建链路暂未启用;解开本 job 其余注释即生效。"

