name: Release

# heartflow 自动发布,三段式:plan(dry) → publish → windows-zip(便携包,随每次发布)
#   - 零 Node:版本计算/CHANGELOG/Release 全部走 scripts/release.sh + git-cliff,本地可先行验证省 Actions
#   - 语义:feat→minor、fix→patch、!/BREAKING CHANGE→major;chore 等 push 在 plan 秒级短路
#   - Windows amd64 便携 zip(hf.exe 置于压缩包根 + sha256)上传到 Release;附 SHA256SUMS 清单,
#     并用 actions/attest-build-provenance 签发 SLSA/in-toto 构建溯源(id-token: write)
#   - bucket manifest 由 windows-zip job 直接写真实 version/url/hash(CI 单一写入者,无外部 autoupdate 机器人)
#   - 本链只做"发版":不跑 fmt/clippy/test,不做任何代码风格检查。风格与测试由作者在
#     push 之前本地过完再推,CI 每 push 跑门只烧额度不增加信息(见 ci.yml.bak 头注)
#   - ci.yml 暂存为 ci.yml.bak(改名 .bak 后 GitHub 不识别),本链不做每 push 的 CI 质量门;
#     文档站是另一条独立链,见 docs.yml(仅在 docs/** 变动时触发)。
#   - 本地预检:bash scripts/release.sh plan;RELEASE_DRY_RUN=1 bash scripts/release.sh publish
#   - 续发:publish 中途失败(超时/限流耗尽)时 tag 已打、Release 已建,再 push 或重跑本链都会因
#     "tag 之后没有 feat/fix" 判 released=false 而整体短路;此时本地续发:
#     RELEASE_TAG=<tag> RELEASE_BUMP=<bump> bash scripts/release.sh publish
#     已上传的包由 publish_retry 的 "already uploaded" 分支幂等跳过,不会重发同版本。

on:
  push:
    branches: [main]
  workflow_dispatch: # 仅用于发布失败后重试,concurrency 锁防与 push 重叠

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 418982825+github-actions[bot]@users.noreply.github.com

jobs:
  plan:
    name: dry 算版本(只读)
    runs-on: ubuntu-latest
    # dispatch 可在任意分支手动触发,但 publish 会推 main;锁死只允许 main 分支跑发布链
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    outputs:
      released: ${{ steps.plan.outputs.released }}
      bump: ${{ steps.plan.outputs.bump }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-git-cliff
      - id: plan
        run: bash scripts/release.sh plan

  publish:
    name: 版本落地 / tag / GitHub Release / crates.io
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    # 八个包逐个 cargo publish,每个都跑一次 verify 构建(源码解到 target/package/<name>-<ver>,
    # 但构建共用 workspace 的 target,故依赖只编一遍);再叠最坏约 10 分钟的 crates.io 429 退避。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-git-cliff
      - name: install toolchain(rust-toolchain.toml 为唯一版本源)
        # verify 构建也在本 job 内发生:不用 runner 预装的 stable,否则同一 tag 的校验编译器
        # 会随 runner 镜像漂移,与本地 fmt/clippy/test 用的不是同一版本。
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: release.sh publish
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_BUMP: ${{ needs.plan.outputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: bash scripts/release.sh publish

  windows-zip:
    name: win-amd64 便携 zip(scoop 供包)
    needs: [plan, publish]
    if: needs.plan.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # gh release upload
      # attest-build-provenance 需要两个 scope:id-token 用来换 Sigstore 签名证书,
      # attestations 用来把生成的 in-toto/SLSA 证明存进仓库的 attestations API。
      # 只给 id-token 会在签发后写回那步 403——官方 v2 README 的必需项是这两条一起给。
      # 仓库为 public,符合 attestation 的可用前提(私有库需 Enterprise Cloud)。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1
      # 工具链版本只认仓库根的 rust-toolchain.toml:workflow 里不写死版本,否则 runner
      # 上的 stable 与本地开发用的编译器会分叉,同一个 tag 不再可复现。
      - name: install toolchain(rust-toolchain.toml 为唯一版本源)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build (hf.exe)
        run: cargo build --release -p heartflow --target x86_64-pc-windows-msvc
      - name: pack zip + sha256
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = ("${{ needs.plan.outputs.tag }}" -replace "^v", "")
          $name = "heartflow-$v-win-amd64.zip"
          # hf.exe 置于压缩包根目录,scoop 解包后直接挂 bin;sha256 文件供 manifest 校验
          Compress-Archive -Path "target\x86_64-pc-windows-msvc\release\hf.exe" -DestinationPath $name -Force
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content "$name.sha256" -Encoding ascii
          "sha=$sha" >> $Env:GITHUB_OUTPUT
      - name: upload zip + sha256 to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $v = ("${{ needs.plan.outputs.tag }}" -replace "^v", "")
          $name = "heartflow-$v-win-amd64.zip"
          gh release upload "${{ needs.plan.outputs.tag }}" $name "$name.sha256" --clobber
      - name: publish SHA256SUMS manifest + SLSA build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $v = ("${{ needs.plan.outputs.tag }}" -replace "^v", "")
          $name = "heartflow-$v-win-amd64.zip"
          # Tooling-consumable checksum manifest (`sha256sum` format), attached to
          # the release so verifiers get one canonical file for every asset.
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant() + "  $name" |
            Set-Content SHA256SUMS.txt -Encoding ascii
          gh release upload "${{ needs.plan.outputs.tag }}" SHA256SUMS.txt --clobber
      - name: attest build provenance (SLSA/in-toto)
        # Binds hf.exe to this repo + commit + runner via an OIDC-signed
        # provenance statement, so consumers can verify the binary was built by
        # this pipeline rather than merely that its hash matches the manifest.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: heartflow-*-win-amd64.zip
      - name: update bucket manifest (version + url + hash)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 自托管 bucket,CI 是唯一写入者:version/url/hash 三者全由本次 tag 独立推导。
          # url 恒等于 release 下载地址(以 homepage 为基,不硬编码 host/repo),不再解析
          # 上一版 url 做子串替换——少一层假设,历史漂移也能自愈;scoop 下载与 hash 天然对应。
          $tag = "${{ needs.plan.outputs.tag }}"
          $v = ($tag -replace "^v", "")
          $name = "heartflow-$v-win-amd64.zip"
          $m = Get-Content bucket/heartflow.json -Raw | ConvertFrom-Json
          $m.version = $v
          $m.architecture."64bit".url = "$($m.homepage)/releases/download/$tag/$name"
          $m.architecture."64bit".hash = "${{ steps.pack.outputs.sha }}"
          # pwsh7 utf8 本就无 BOM;显式 utf8NoBOM 以免疫环境默认编码(带 BOM 会令部分 JSON 解析器报错)
          ($m | ConvertTo-Json -Depth 10) | Set-Content bucket/heartflow.json -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "418982825+github-actions[bot]@users.noreply.github.com"
          git add bucket/heartflow.json
          # 幂等:同版本重传时 manifest 内容不变,不产生空提交。必须先暂存再用
          # `git diff --cached --quiet` 判,且判 $LASTEXITCODE——PowerShell 拿命令
          # 输出当布尔值判真假,直接写 `if (git diff ...)` 永远为真。
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "manifest already current for $tag"; exit 0 }
          git commit -m "chore(bucket): update manifest for $tag [skip ci]"
          git push origin HEAD:main
