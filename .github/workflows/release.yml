name: Release

# heartflow 自动发布(个性化设计,勿随意改语义):
#   - 单一 ubuntu job 完成 semver 计算 / Cargo 版本同步 / CHANGELOG / tag / GitHub Release
#   - 不引 Node、不用 semantic-release:为省 action 时长与 workspace 单一版本点定制
#   - Windows amd64 安装包仅在 major(主版本)触发;构建步骤当前整段注释占位,启用即解开
#   - 无 feat/fix/破坏性提交的 push(纯 chore/docs 等)在此快速退出,不产生任何版本动作

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 418982825+github-actions[bot]@users.noreply.github.com

jobs:
  release:
    name: bump / tag / github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.plan.outputs.released }}
      bump: ${{ steps.plan.outputs.bump }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install git-cliff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="$(gh release view -R orhun/git-cliff --json tagName -q .tagName)"
          N="${V#v}"
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/${V}/git-cliff-${N}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv "git-cliff-${N}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: plan next version
        id: plan
        run: |
          set -euo pipefail
          LAST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST" ]; then
            LOG="$(git log "${LAST}..HEAD" --no-merges --pretty=%B)"
          else
            LOG="$(git log --no-merges --pretty=%B)"
          fi
          # 只有 feat/fix/破坏性变更参与发版;chore、docs、test、ci 等直接退出
          if ! grep -qE '^(feat|fix)(\([^)]*\))?:|^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<<"$LOG"; then
            echo "released=false" >>"$GITHUB_OUTPUT"
            echo "::notice::无版本相关提交(相对 ${LAST:-仓库初始}),跳过发版"
            exit 0
          fi
          BASE="${LAST:-v0.0.0}"
          RAWNEXT="$(git-cliff --unreleased --bumped-version)"
          N="${RAWNEXT#v}"
          NEXT="v${N}"
          if [ "$NEXT" = "$BASE" ]; then
            echo "released=false" >>"$GITHUB_OUTPUT"
            echo "::notice::git-cliff 未产生版本递增,跳过发版"
            exit 0
          fi
          L="${BASE#v}"; LM="${L%%.*}"; LMI="$(cut -d. -f2 <<<"$L")"
          NM="${N%%.*}"; NMI="$(cut -d. -f2 <<<"$N")"
          if [ "$NM" != "$LM" ]; then BUMP=major
          elif [ "$NMI" != "$LMI" ]; then BUMP=minor
          else BUMP=patch; fi
          {
            echo "released=true"
            echo "bump=$BUMP"
            echo "tag=$NEXT"
          } >>"$GITHUB_OUTPUT"
          echo "${LAST:+${LAST} → }${NEXT} (${BUMP})"

      - name: bump cargo / changelog / push tag
        if: steps.plan.outputs.released == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          VER="${TAG#v}"
          # 单一版本点:根 [workspace.package];各 crate 经 version.workspace = true 继承
          sed -i "0,/^version = \"/s/^version = \"[^\"]*\"/version = \"${VER}\"/" Cargo.toml
          # 只同步 workspace 内部 crate 在 Cargo.lock 中的版本,离线不触碰外部依赖
          cargo update --workspace --offline
          git-cliff --unreleased --bump -o release-notes.md
          git-cliff --unreleased --bump --prepend -o CHANGELOG.md
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag "$TAG"
          git push origin "HEAD:main" "refs/tags/${TAG}"

      - name: create github release
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          case "${{ steps.plan.outputs.bump }}" in
            major) LABEL=主版本 ;;
            minor) LABEL=次版本 ;;
            *) LABEL=修订 ;;
          esac
          gh release create "$TAG" \
            --target main \
            --title "heartflow ${TAG} (${LABEL})" \
            --notes-file release-notes.md

