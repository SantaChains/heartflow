name: install git-cliff
description: 下载 git-cliff 预编译二进制(ubuntu only;plan/publish 均在 ubuntu 跑)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if command -v git-cliff >/dev/null 2>&1; then git-cliff --version; exit 0; fi
        V="$(curl -fsSL -o /dev/null -w '%{url_effective}' -I -L https://github.com/orhun/git-cliff/releases/latest | sed 's#.*/tag/v##')"
        curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${V}/git-cliff-${V}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
        sudo mv "git-cliff-${V}/git-cliff" /usr/local/bin/git-cliff
        git-cliff --version
