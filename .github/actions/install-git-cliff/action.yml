name: install git-cliff
description: 下载 git-cliff 预编译二进制并校验 sha512(ubuntu only;plan/publish/gate 均在 ubuntu 跑)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if command -v git-cliff >/dev/null 2>&1; then git-cliff --version; exit 0; fi
        # 钉住版本:git-cliff 模板引擎行为随版本变动(groupby/group_by 事故教训),
        # 升级需显式改这里,并先过本地 RELEASE_DRY_RUN=1 预检。
        # 校验 sha512:上游为每个平台资产发布同名 .sha512(sha512sum 格式),
        # 下载即校验,避免供应链在中间环节被替换。
        V="2.14.2"
        ASSET="git-cliff-${V}-x86_64-unknown-linux-gnu.tar.gz"
        BASE="https://github.com/orhun/git-cliff/releases/download/v${V}"
        curl -fsSL -O "${BASE}/${ASSET}"
        curl -fsSL -O "${BASE}/${ASSET}.sha512"
        sha512sum -c "${ASSET}.sha512"
        tar -xzf "${ASSET}"
        sudo mv "git-cliff-${V}/git-cliff" /usr/local/bin/git-cliff
        git-cliff --version
